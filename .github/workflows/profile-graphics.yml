name: Refresh profile graphics

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-graphics.yml"
      - "scripts/profile-trophies.cjs"

permissions:
  contents: read

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate blue contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8fbcdf&color_dots=#374247,#244c70,#326da2,#438bd0,#8fbcdf
            dist/snake-light.svg?color_snake=#326da2&color_dots=#ebedf0,#c6ddf0,#8fbcdf,#438bd0,#244c70

      - name: Generate Nord trophy cards
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const render = require('./scripts/profile-trophies.cjs');
            await render({ github, context });

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D graphics
        shell: bash
        run: |
          cp profile-3d-contrib/profile-night-rainbow.svg dist/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg dist/contrib-3d-light.svg

      - name: Upload generated SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-graphics
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated SVGs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: profile-graphics
          path: dist

      - name: Publish graphics to output branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const branch = 'output';
            let parent;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              parent = data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const paths = ['snake-dark.svg', 'snake-light.svg', 'trophy.svg', 'contrib-3d-dark.svg', 'contrib-3d-light.svg'];
            const tree = [];
            for (const path of paths) {
              const content = await fs.readFile('dist/' + path, 'utf8');
              if (!content.includes('<svg')) throw new Error('Invalid SVG: ' + path);
              tree.push({ path, mode: '100644', type: 'blob', content });
            }
            const { data: generatedTree } = await github.rest.git.createTree({ owner, repo, tree });
            if (parent) {
              const { data: previous } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              if (previous.tree.sha === generatedTree.sha) {
                core.info('Profile graphics are already up to date.');
                return;
              }
            }
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: 'Refresh profile graphics',
              tree: generatedTree.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/' + branch, sha: commit.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: commit.sha });
            }
